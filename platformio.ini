; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/pa



[env:esp32-s3-devkitc-1-n16r8v]

lib_deps = madhephaestus/ESP32Servo
platform = espressif32
board = esp32-s3-devkitc-1-n16r8v
framework = arduino

; ===============================
; Serial monitor
; ===============================
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; ===============================
; Build & debug
; ===============================
build_type = debug
debug_tool = esp-builtin
debug_speed = 1000
debug_init_break = tbreak setup

; ===============================
; Upload (ВАЖЛИВО)
; ===============================
; Прошивка через UART, не через JTAG
upload_protocol = esptool

; ===============================
; OpenOCD (критично для стабільності)
; ===============================
debug_server =
    $PLATFORMIO_CORE_DIR/packages/tool-openocd-esp32/bin/openocd
    -f board/esp32s3-builtin.cfg
    -c "gdb_timeout 5000"

; ===============================
; Опціонально (корисно)
; ===============================
debug_extra_cmds =
    set print pretty on
    set remotetimeout 5
